name: matrimony_app
description: "Matrimonyer — A modern, elegant Matrimony Application with image-first discovery, swipe deck, and multi-phase publishing."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.20.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  image_picker: ^1.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
